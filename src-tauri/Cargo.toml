[package]
name = "hs-tracker"
version = "0.9.3"
description = "HS Tracker — Hero Siege session tracker overlay"
edition = "2021"

[lib]
name = "hs_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
winreg = "0.52"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
pcap = "2"
etherparse = "0.16"
netstat2 = "0.11"
sysinfo = "0.33"

[profile.release]
opt-level = "s"
lto = true
strip = true

[lints.rust]
# the MSVC linker prints an informational line when it creates the import
# library; rustc surfaces it as a warning on every build
linker_messages = "allow"
