[package]
name = "hs-tracker"
version = "0.9.6"
description = "HS Tracker — Hero Siege session tracker overlay"
edition = "2021"

[lib]
name = "hs_tracker_lib"
# the template ships staticlib and cdylib for mobile targets; this is a desktop
# app, so main.rs links the rlib and nothing else is built
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# wayland-data-control lets the clipboard work in a Wayland session that has no
# XWayland; on Windows the feature is inert
arboard = { version = "3", features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
pcap = "2"
etherparse = "0.16"
netstat2 = "0.11"
sysinfo = "0.33"

# autostart is a registry value on Windows and a .desktop file elsewhere
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true

[lints.rust]
# the MSVC linker prints an informational line when it creates the import
# library; rustc surfaces it as a warning on every build
linker_messages = "allow"
