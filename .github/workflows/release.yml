name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# read-only by default; only the job that publishes the release asks for more
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # creating the release and attaching the installer needs write access; new
    # repositories hand Actions a read-only token by default
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # package.json owns the version; fail the build if the tag disagrees
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/set-version.mjs
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: npm run build

      # the Npcap SDK import libraries are vendored, and wpcap.dll is
      # delay-loaded, so no driver is needed on the runner
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: CHANGELOG.md

  # Nothing is published from here. Hero Siege's anti-cheat currently keeps the
  # game itself off Linux, so this job exists to prove the port still compiles
  # and to have the packages ready the day that changes.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk drives the windows, libpcap the capture, appindicator the tray
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libpcap-dev patchelf

      - run: npm ci
      # package.json owns the version; the Windows job syncs it the same way
      - run: node scripts/set-version.mjs
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
