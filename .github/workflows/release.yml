name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# read-only by default; only the job that publishes the release asks for more
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # creating the release and attaching the installer needs write access; new
    # repositories hand Actions a read-only token by default
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # package.json owns the version; fail the build if the tag disagrees
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/set-version.mjs
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: npm run build

      # the Npcap SDK import libraries are vendored, and wpcap.dll is
      # delay-loaded, so no driver is needed on the runner
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # the release text is this version's section of the changelog, not the
      # whole history: everything from the first "## " heading to the next one
      - name: Cut the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: RELEASE_NOTES.md

  # The Linux half of a release: the same code, packaged as a .deb and an
  # AppImage. The artifact is uploaded whether or not this is a tagged run, so
  # a build can be handed to a tester without cutting a release.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk drives the windows, libpcap the capture, appindicator the tray
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libpcap-dev patchelf

      - run: npm ci
      # package.json owns the version; the Windows job syncs it the same way
      - run: node scripts/set-version.mjs
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # Attaches the .deb and the AppImage to the tagged release, next to the
  # Windows installer. It waits for the Windows job so the two never write the
  # same release at once, and carries no body_path: the release text is already
  # there. Set the repository variable PUBLISH_LINUX to "false" to hold the
  # Linux packages back for a release without touching this file.
  publish-linux:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_LINUX != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hs-tracker-linux
          path: linux

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/deb/*.deb
            linux/appimage/*.AppImage
