name: release

# Not on a tag any more. The packages are built on the maintainer's machine —
# `npm run all` — and the release is cut with `npm run publish`, because a
# hosted runner spent an evening timing out against a dead Ubuntu mirror while
# the same build took four minutes here. Start it by hand when a second opinion
# is wanted: the .rpm in particular is built on Fedora here and on Debian there,
# and Fedora is the more careful place to record what the package depends on.
on:
  workflow_dispatch:

# read-only by default; only the job that publishes the release asks for more
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # creating the release and attaching the installer needs write access; new
    # repositories hand Actions a read-only token by default
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No `npm run build` here: tauri.conf.json's beforeBuildCommand runs it,
      # so every job was building the front end twice.
      - run: npm ci

      # package.json owns the version; fail the build if the tag disagrees
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/set-version.mjs
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package.json $pkg"; exit 1; }


      # the Npcap SDK import libraries are vendored, and wpcap.dll is
      # delay-loaded, so no driver is needed on the runner
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # the release text is this version's section of the changelog, not the
      # whole history: everything from the first "## " heading to the next one
      - name: Cut the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: RELEASE_NOTES.md

  # The Debian half: a .deb and an AppImage. The artifact is uploaded whether or
  # not this is a tagged run, so a build can be handed to a tester without
  # cutting a release. The .rpm is built elsewhere — see below.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk drives the windows, libpcap the capture, appindicator the
      # tray. The rest is AppImage tooling: linuxdeploy needs patchelf, zsync
      # and the desktop-file utils, its GTK and GStreamer plugins copy in what
      # the webview uses to play the alert sounds, and its own runtime needs
      # FUSE 2 — a package Ubuntu renamed in 24.04.
      # The runner points apt at azure.archive.ubuntu.com, which goes dark often
      # enough to matter: every index times out in turn, apt falls back to the
      # main archive, and a step that takes ninety seconds took an hour and a
      # half before anyone noticed it was not building anything. So: the main
      # archive outright, short timeouts, few retries, and a ceiling on the step
      # so a dead mirror fails the run instead of renting a runner all evening.
      - name: Install the system libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'             /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev libpcap-dev             patchelf zsync desktop-file-utils             gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          sudo apt-get $apt_opts install -y libfuse2             || sudo apt-get $apt_opts install -y libfuse2t64

      - run: npm ci
      # package.json owns the version; the Windows job syncs it the same way
      - run: node scripts/set-version.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The .deb is the artifact that matters and it is built on its own, so
      # nothing that happens to the AppImage can withhold it.
      - run: npx tauri build --bundles deb

      # The AppImage bundler fetches AppRun, linuxdeploy and the GTK plugin from
      # github.com and raw.githubusercontent.com at bundle time. Those are
      # unauthenticated requests from a shared runner IP, and they come back 429
      # often enough to have taken a whole release down: the .deb above had
      # already been built, and the job failing meant it was never uploaded.
      #
      # Rate limiting passes, so it is retried rather than given up on, and the
      # step cannot fail the job — a release with a .deb and no AppImage is a
      # release; a release with neither is not.
      - name: Bundle the AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          for attempt in 1 2 3; do
            if npx tauri build --bundles appimage; then
              exit 0
            fi
            echo "::warning::AppImage bundling failed (attempt $attempt/3), waiting"
            sleep $((attempt * 45))
          done
          echo "::warning::no AppImage this time; the .deb is unaffected"
          exit 1

      # The AppImage glob may match nothing — see the step above. The .deb never
      # does, so the artifact is always uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # An RPM has to be built where it will run. Debian calls the capture library
  # libpcap.so.0.8 and Fedora calls the same library libpcap.so.1, so a package
  # built on Ubuntu installs on Fedora and then refuses to start.
  rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make rust cargo nodejs npm \
            webkit2gtk4.1-devel gtk3-devel libayatana-appindicator-gtk3-devel \
            librsvg2-devel libpcap-devel openssl-devel file which findutils tar

      - run: npm ci
      - run: node scripts/set-version.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles rpm

      - uses: actions/upload-artifact@v4
        with:
          name: hs-tracker-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

  # Attaches the three Linux packages to the tagged release, next to the Windows
  # installer. It waits for the Windows job so the two never write the same
  # release at once, and carries no body_path: the release text is already
  # there. Set the repository variable PUBLISH_LINUX to "false" to hold the
  # Linux packages back for a release without touching this file.
  publish-linux:
    needs: [build, linux, rpm]
    # `!cancelled()` rather than `always()`: a cancelled run should stop, but a
    # failed rpm job should not hold back the .deb and the AppImage that built
    # perfectly well beside it. The rpm image is Fedora and outlives its own
    # support window; when it breaks it must break alone.
    #
    # Not `continue-on-error` on the rpm job — that would make the run read
    # green and report `success` here, which is worse than the problem.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/')
      && vars.PUBLISH_LINUX != 'false'
      && needs.build.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hs-tracker-linux
          path: linux

      # download-artifact errors hard on an artifact that was never uploaded,
      # so the guard belongs here as well as on the release step.
      - uses: actions/download-artifact@v4
        if: needs.rpm.result == 'success'
        with:
          name: hs-tracker-rpm
          path: linux/rpm

      # The .rpm may not be here at all — see the guard on its download above.
      # A pattern that matches nothing is not an error to this action, but say
      # so rather than leaving the release to a default.
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            linux/deb/*.deb
            linux/rpm/*.rpm
            linux/appimage/*.AppImage
