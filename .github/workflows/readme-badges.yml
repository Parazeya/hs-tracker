name: README badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-badges.yml
      - scripts/update-readme-badges.mjs
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency: readme-badges

jobs:
  refresh:
    if: github.repository == 'Parazeya/hs-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh the release badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-readme-badges.mjs
      - name: Commit changed badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/readme-release.svg screenshots/readme-downloads.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh README release badges"
          git push origin HEAD:main
